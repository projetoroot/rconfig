main:
  name: "nethsecurity_ssh"
  desc: "NethSecurity SSH"

connect:
  protocol: "ssh"
  port: 22
  timeout: 30
  isNonInteractiveMode: "off"

auth:
  username: ""
  password: ""
  enable: "off"
  enableCmd: ""
  enableUsername: "off"
  enableUsernamePrmpt: ""
  enablePassPrmpt: ""
  hpAnyKeyStatus: "off"
